[package]
name = "rpgp-gui"
description = "Slint front end for rpgp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "rpgp_gui"
path = "src/lib.rs"

[[bin]]
name = "rpgp"
path = "src/main.rs"

[dependencies]
rpgp-core.workspace = true

# default-features = false keeps two C/C++ dependencies out of the build:
# `backend-qt`, which the selector compiles in whenever qmake is on PATH and
# then *prefers over winit at runtime*, and `renderer-skia`. renderer-femtovg-wgpu
# draws through wgpu (Vulkan on Linux, Metal on macOS) instead of femtovg's
# OpenGL path, which is deprecated on macOS. renderer-software stays enabled as
# a fallback for machines without a usable GPU: SLINT_BACKEND=winit-software.
slint = { version = "1.17", default-features = false, features = [
    "std",
    "compat-1-2",
    "accessibility",
    "backend-winit",
    "renderer-femtovg-wgpu",
    "renderer-software",
    # Needed only to widen the backend set wgpu is allowed to pick from; see
    # `configure_renderer` in main.rs. The API is unstable and tied to wgpu's
    # major version, so it will need revisiting when Slint moves to wgpu 30.
    "unstable-wgpu-29",
] }

# Defaults are xdg-portal + wayland + pollster: no GTK, so no C dependency on
# Linux. macOS uses the AppKit bindings.
rfd = "0.17"

# Slint exposes no clipboard API, only a platform trait for backend authors.
# wayland-data-control is the wlr protocol, which GNOME does not implement, so
# this falls back to X11 through XWayland there.
# Hands a URL to the desktop's own opener: xdg-open on Linux, open on macOS.
open = "5"

arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }

zeroize.workspace = true

# Already in the dependency graph via slint's accesskit stack; named here to
# use prctl and setrlimit directly. Uses its linux_raw backend on Linux, so it
# adds no C dependency.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
# ElementHandle::accessible_value, to assert on what the accessibility tree
# actually publishes rather than trusting that input-type is enough.
i-slint-backend-testing = "1.17"

[[bench]]
name = "keystroke"
harness = false

[build-dependencies]
slint-build = "1.17"

# Windows only, and a build dependency, so it never enters the shipped binary
# or any other platform's graph. Without it the .exe has no resource section at
# all: no icon (the taskbar and title bar show a generic placeholder), no
# version info (Explorer's Details tab is blank), and no manifest (the process
# is DPI-unaware and Windows bitmap-scales it on any HiDPI display).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
