[package]
name = "rpgp-gui"
description = "Slint front end for rpgp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "rpgp_gui"
path = "src/lib.rs"

[[bin]]
name = "rpgp"
path = "src/main.rs"

[dependencies]
rpgp-core.workspace = true

# default-features = false keeps two C/C++ dependencies out of the build:
# `backend-qt`, which the selector compiles in whenever qmake is on PATH and
# then *prefers over winit at runtime*, and `renderer-skia`. renderer-femtovg-wgpu
# draws through wgpu (Vulkan on Linux, Metal on macOS) instead of femtovg's
# OpenGL path, which is deprecated on macOS. renderer-software stays enabled as
# a fallback for machines without a usable GPU: SLINT_BACKEND=winit-software.
#
# Exactly 1.18.1, as are slint-build and i-slint-backend-testing below, for as
# long as the root Cargo.toml patches Slint's winit backend: the patch is that
# version's crate, and cargo only warns when a newer slint leaves it unused,
# which would quietly take copy and paste out of the Flatpak's text fields
# again. With Slint 1.19 the patch goes, and the three go back to plain
# version requirements; the root Cargo.toml says how.
slint = { version = "=1.18.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "accessibility",
    "backend-winit",
    "renderer-femtovg-wgpu",
    "renderer-software",
    # Needed only for the explicit wgpu request in `configure_renderer` in
    # src/lib.rs, which probes for a GPU up front and pins the backend set
    # wgpu may pick from. The API is unstable and tied to
    # wgpu's major version, which has to be the one femtovg draws through:
    # wgpu 30 since Slint 1.18. A request for wgpu 29 still compiles, with
    # unstable-wgpu-29, but nothing in this build gives wgpu 29 a backend: on
    # Linux `select()` panics in Slint's wgpu 29 probe, and with that probe
    # skipped (SLINT_WGPU_CPU) the window is femtovg's on wgpu 30, which
    # refuses the request, and the event loop fails. Revisit it whenever Slint
    # moves femtovg to another wgpu.
    "unstable-wgpu-30",
    # Window::window_handle, which is how the first-window watch in
    # src/lib.rs learns whether Slint has made the native window yet, and how
    # the clipboard learns whether the window is on Wayland; see
    # src/clipboard.rs.
    "raw-window-handle-06",
] }

# Defaults are xdg-portal + wayland + pollster: no GTK, so no C dependency on
# Linux. macOS uses the AppKit bindings.
rfd = "0.18"

# Hands a URL to the desktop's own opener: xdg-open on Linux, open on macOS.
open = "5"

# Slint exposes no clipboard API, only a platform trait for backend authors, so
# the Copy buttons bring their own (src/clipboard.rs), which is arboard wherever
# arboard can be built. wayland-data-control has it copy through the wlr or ext
# data-control protocol whenever WAYLAND_DISPLAY is set and the compositor
# offers the app either. Where none is offered it falls back to X11, which on a
# Wayland session means XWayland, and which the Flatpak there does not have:
# there the Copy buttons go through Slint's own clipboard instead.
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }

zeroize.workspace = true

# The traits Window::window_handle's handle is read through. The first-window
# watch in src/lib.rs needs them on every platform, and src/clipboard.rs on
# the targets where a window can be on Wayland. Slint does not re-export them,
# and raw-window-handle 0.6 is already in every platform's graph through
# Slint, winit, wgpu, softbuffer and rfd, so naming it here adds nothing to
# Cargo.lock.
raw-window-handle = "0.6"

# Already in the dependency graph via slint's accesskit stack; named here to
# use prctl and setrlimit directly, and with `net` for src/clipboard.rs to ask
# whether its connection to the X server is a Unix-domain socket. Uses its
# linux_raw backend on Linux, so it adds no C dependency, and neither feature
# adds a crate to Cargo.lock.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process", "net"] }

# The X11 half of withdrawing a private copy when the window closes; see
# `withdraw` in src/clipboard.rs. arboard does that itself when its last handle
# is dropped, but since Slint 1.18 the winit backend holds two handles of its
# own on X11 until the process exits, so rPGP's is never the last. `res` is
# the X-Resource extension, through which the X server says which process owns
# the clipboard. x11rb 0.13 is already in Cargo.lock through arboard, winit
# and softbuffer, and a feature adds no crate. The cfg is the one that has
# always gated the clipboard's Wayland half, the targets where a window can be
# on Wayland, which are also the ones where it can be on X11. build.rs sets
# cfg(wayland_target) on the same condition for the code that uses it; change
# both together.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "android", target_os = "ios", target_os = "emscripten"))))'.dependencies]
x11rb = { version = "0.13", default-features = false, features = ["res"] }

[dev-dependencies]
# ElementHandle::accessible_value, to assert on what the accessibility tree
# actually publishes rather than trusting that input-type is enough.
# Exactly 1.18.1 while Slint's winit backend is patched; see slint above.
i-slint-backend-testing = "=1.18.1"
# A real store on disk for the reload tests: read_store takes a Store, and the
# badges it stitches come from four separate files in one.
tempfile = "3"

# tests/atspi.rs, which runs a window under winit and reads what reaches the
# AT-SPI bus: atspi's proxies and zbus to talk to the bus, futures-lite to
# wait on them, and x11rb for the window to take the X server's focus, without
# which Slint publishes no focus at all. Every one is already in Cargo.lock,
# atspi, zbus and futures-lite through accesskit_unix and x11rb through
# arboard, softbuffer and winit, so nothing new is fetched, and the Flatpak,
# which builds no tests, is untouched.
[target.'cfg(target_os = "linux")'.dev-dependencies]
atspi = { version = "0.29", default-features = false, features = ["proxies"] }
zbus = { version = "5", default-features = false, features = ["async-io"] }
futures-lite = "2"
x11rb = { version = "0.13", default-features = false }

# No harness, because winit wants the main thread. Off Linux its main does
# nothing.
[[test]]
name = "atspi"
harness = false

[[bench]]
name = "keystroke"
harness = false

[build-dependencies]
# Exactly 1.18.1 while Slint's winit backend is patched; see slint above.
slint-build = "=1.18.1"

# Windows only, and a build dependency, so it never enters the shipped binary
# or any other platform's graph. Without it the .exe has no resource section at
# all: no icon for Explorer to draw for the file and its shortcuts (the window
# sets its own at run time), no version info (Explorer's Details tab is
# blank), and no manifest (the process is then DPI-aware only once winit's
# event loop makes it so, not from the moment it starts; see build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
