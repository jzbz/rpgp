[package]
name = "rpgp-gui"
description = "Slint front end for rpgp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "rpgp_gui"
path = "src/lib.rs"

[[bin]]
name = "rpgp"
path = "src/main.rs"

[dependencies]
rpgp-core.workspace = true

# default-features = false keeps two C/C++ dependencies out of the build:
# `backend-qt`, which the selector compiles in whenever qmake is on PATH and
# then *prefers over winit at runtime*, and `renderer-skia`. renderer-femtovg-wgpu
# draws through wgpu (Vulkan on Linux, Metal on macOS) instead of femtovg's
# OpenGL path, which is deprecated on macOS. renderer-software stays enabled as
# a fallback for machines without a usable GPU: SLINT_BACKEND=winit-software.
slint = { version = "1.17", default-features = false, features = [
    "std",
    "compat-1-2",
    "accessibility",
    "backend-winit",
    "renderer-femtovg-wgpu",
    "renderer-software",
    # Needed only to widen the backend set wgpu is allowed to pick from; see
    # `configure_renderer` in main.rs. The API is unstable and tied to wgpu's
    # major version, so it will need revisiting when Slint moves to wgpu 30.
    "unstable-wgpu-29",
    # Window::window_handle, which is how the clipboard learns whether the
    # window is on Wayland and reaches its connection; see src/clipboard.rs.
    "raw-window-handle-06",
] }

# Defaults are xdg-portal + wayland + pollster: no GTK, so no C dependency on
# Linux. macOS uses the AppKit bindings.
rfd = "0.17"

# Hands a URL to the desktop's own opener: xdg-open on Linux, open on macOS.
open = "5"

# Slint exposes no clipboard API, only a platform trait for backend authors, so
# the Copy buttons bring their own (src/clipboard.rs), which is arboard wherever
# arboard can be built. wayland-data-control has it copy through the wlr or ext
# data-control protocol whenever WAYLAND_DISPLAY is set and the compositor
# offers the app either. Where none is offered it falls back to X11, which on a
# Wayland session means XWayland, and which the Flatpak there does not have.
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }

zeroize.workspace = true

# Already in the dependency graph via slint's accesskit stack; named here to
# use prctl and setrlimit directly. Uses its linux_raw backend on Linux, so it
# adds no C dependency.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

# Copy for a window on Wayland for which arboard cannot be built: the core
# wl_data_device protocol, on the window's own connection, which is how Slint's
# text fields copy and which every compositor offers every client. The
# data-control protocols arboard uses are not: GNOME implements neither, and
# sway hides both from a Flatpak, which has no X11 for arboard to fall back to
# on a Wayland session. Both crates are already in the graph through Slint's
# winit backend, and the cfg is copypasta's, so they come in on exactly the
# targets that already have them. build.rs sets cfg(wayland_target) on the same
# condition for the code that uses them; change both together.
# smithay-clipboard's default feature loads libwayland at runtime, as the rest
# of the graph already does, rather than linking it.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "android", target_os = "ios", target_os = "emscripten"))))'.dependencies]
smithay-clipboard = "0.7"
raw-window-handle = "0.6"

[dev-dependencies]
# ElementHandle::accessible_value, to assert on what the accessibility tree
# actually publishes rather than trusting that input-type is enough.
i-slint-backend-testing = "1.17"
# A real store on disk for the reload tests: read_store takes a Store, and the
# badges it stitches come from four separate files in one.
tempfile = "3"

[[bench]]
name = "keystroke"
harness = false

[build-dependencies]
slint-build = "1.17"

# Windows only, and a build dependency, so it never enters the shipped binary
# or any other platform's graph. Without it the .exe has no resource section at
# all: no icon (the taskbar and title bar show a generic placeholder), no
# version info (Explorer's Details tab is blank), and no manifest (the process
# is DPI-unaware and Windows bitmap-scales it on any HiDPI display).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
