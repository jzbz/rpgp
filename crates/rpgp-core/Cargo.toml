[package]
name = "rpgp-core"
description = "OpenPGP certificate store, key generation and message operations for rpgp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
sequoia-openpgp.workspace = true
sequoia-cert-store.workspace = true
sequoia-wot.workspace = true
sequoia-gpg-agent.workspace = true
sequoia-ipc.workspace = true
tokio.workspace = true
futures.workspace = true
reqwest.workspace = true
rustls.workspace = true
webpki-roots.workspace = true
sha1.workspace = true
z-base-32.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
dirs.workspace = true
chrono.workspace = true

zeroize.workspace = true

# Windows ACLs for the secret-key store. windows-sys rather than `windows`:
# it is already in the lock via tokio, tempfile and dirs-sys, so this unifies
# onto a copy that is compiled anyway, and it stays pure Rust — no build
# script, no bundled import libraries, just raw-dylib declarations.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"

# Plain binary, no bench harness: see the module docs in benches/reload.rs for
# why this is not criterion.
[[bench]]
name = "reload"
harness = false
