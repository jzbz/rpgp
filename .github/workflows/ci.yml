# Only official actions are used here on purpose. This is a project about
# handling secret keys, and a third-party action runs with the same access to
# the workflow as anything else in it.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer push makes an in-flight run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    # Nothing else bounds a job. GitHub's default is six hours, long enough
    # that a wedged network call reads as a slow queue rather than a failure.
    # These ceilings sit well above a cold-cache build and should never fire.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # capnproto is not optional: sequoia-ipc's build script runs the capnp
      # compiler unconditionally. fontconfig is what Slint draws text with on
      # Linux, reached through parley's fontconfig-sys, whose build script
      # fails the build outright if the pkg-config probe misses; macOS uses
      # CoreText instead and needs neither. libsqlite3-dev is usually already
      # on the image, but libsqlite3-sys resolves without its bundled feature
      # here and links system SQLite, and what the image ships is not a
      # promise.
      #
      # apt has no wall-clock bound of its own. Its timeout is an inactivity
      # timer that every arriving byte resets, so a mirror that accepts the
      # connection and then goes quiet mid-transfer holds apt open forever.
      # That stalled this step for ninety-three minutes, ended only by the
      # next push cancelling the run. The bound has to come from outside apt.
      - name: Install build dependencies
        # Backstop for the loop below, set above its worst case (about
        # 15m25s) so the loop's own message is what fails, not a bare step
        # timeout that says only that something took too long.
        timeout-minutes: 18
        run: |
          set -euo pipefail

          # The runner reaches Ubuntu through a mirrorlist: an in-datacentre
          # Azure mirror first, archive.ubuntu.com behind it. Both have been
          # seen to stall, so nothing here pins a mirror; the aim is only to
          # stop waiting on whichever one is sick.
          opts=(
            # Two retries rather than the built-in three. The loop below
            # is the real retry, and every extra in-apt attempt against a
            # dead mirror is time spent before the fallback gets its turn.
            -o Acquire::Retries=2
            # An idle timeout, not a wall clock: arriving bytes reset it, so
            # this cannot end a stall on its own. It only shortens the wait on
            # a mirror that never answers at all. The runner's own default was
            # not measured, so this is a bound rather than a known reduction.
            -o Acquire::http::Timeout=15
            -o Acquire::https::Timeout=15
            # Translation indexes are no use to a build, and are three more
            # transfers per suite that can wedge.
            -o Acquire::Languages=none
          )

          # Sized against measurement, not against the healthy path. The
          # preamble before the fallback host first answers has been observed
          # at 38s, 38s and 72s, and update moves 11.4 MB (about 8.5 MB with
          # translations off). No completed update over the fallback exists in
          # the record, so this is deliberately loose: too tight a cap turns a
          # slow-but-recoverable run into a hard red, which is the outcome the
          # retry exists to avoid.
          attempts=2
          for attempt in $(seq 1 $attempts); do
            rc=0
            # `sudo timeout`, not `timeout sudo`: the kill has to reach
            # apt-get. Under `timeout sudo` the SIGKILL lands on sudo and
            # orphans a root apt-get still holding the lists lock. The
            # variable is set inside sudo because sudoers resets the
            # environment, so a step-level `env:` would never arrive.
            sudo DEBIAN_FRONTEND=noninteractive timeout --kill-after=15s 180s \
              apt-get "${opts[@]}" update || rc=$?

            # A failed update normally means installing would 404 on a stale
            # index. On the last attempt try regardless: the image ships
            # pre-seeded lists, and the packages this needs come from release
            # pockets that are never superseded, so it is the one remaining
            # path from red back to green.
            if [ "$rc" -eq 0 ] || [ "$attempt" -eq "$attempts" ]; then
              rc=0
              sudo DEBIAN_FRONTEND=noninteractive timeout --kill-after=15s 180s \
                apt-get "${opts[@]}" install -y \
                capnproto libfontconfig-dev libsqlite3-dev || rc=$?
              # Only an interrupted install can leave dpkg mid-transaction,
              # and this is the last unbounded call in the block, so it is
              # bounded too rather than left to the step ceiling.
              if [ "$rc" -ne 0 ]; then
                sudo DEBIAN_FRONTEND=noninteractive timeout --kill-after=10s 60s \
                  dpkg --configure -a || true
              fi
            fi

            if [ "$rc" -eq 0 ]; then
              exit 0
            fi

            echo "::warning::apt attempt $attempt failed with $rc (124 = timed out, 137 = had to be SIGKILLed)"
            # Guarded so the last iteration does not sleep for nothing, and
            # written as `if` because a trailing `&&` test would return 1 and
            # trip `set -e`.
            if [ "$attempt" -lt "$attempts" ]; then
              sleep 5
            fi
          done

          echo "::error::apt failed twice; the Ubuntu mirrors are not answering"
          exit 1

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-lint-

      - name: Versions
        run: cargo --version && cargo clippy --version && cargo fmt --version

      - name: Formatting
        run: cargo fmt --all --check

      # Warnings are errors because the tree is at zero, and the only way that
      # stays true is if letting one through fails the build.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    timeout-minutes: 45
    strategy:
      # macOS is the platform with no local machine behind it, so its result
      # must not be hidden by Linux failing first.
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm is aarch64. It is here because the project ships a
        # Flatpak for that architecture and had never once been compiled for
        # it — macOS covers arm64 the language sees, but not Linux/aarch64 with
        # wgpu and Vulkan underneath. Free on public repositories.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Same shape, and the same reasoning, as the lint job's copy above. It
      # is duplicated rather than factored into a local composite action
      # because step-level timeout-minutes is not supported inside one, and
      # that backstop is the point.
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        # Backstop for the loop below, set above its worst case (about
        # 15m25s) so the loop's own message is what fails, not a bare step
        # timeout that says only that something took too long.
        timeout-minutes: 18
        run: |
          set -euo pipefail

          # The runner reaches Ubuntu through a mirrorlist: an in-datacentre
          # Azure mirror first, archive.ubuntu.com behind it. Both have been
          # seen to stall, so nothing here pins a mirror; the aim is only to
          # stop waiting on whichever one is sick.
          opts=(
            # Two retries rather than the built-in three. The loop below
            # is the real retry, and every extra in-apt attempt against a
            # dead mirror is time spent before the fallback gets its turn.
            -o Acquire::Retries=2
            # An idle timeout, not a wall clock: arriving bytes reset it, so
            # this cannot end a stall on its own. It only shortens the wait on
            # a mirror that never answers at all. The runner's own default was
            # not measured, so this is a bound rather than a known reduction.
            -o Acquire::http::Timeout=15
            -o Acquire::https::Timeout=15
            # Translation indexes are no use to a build, and are three more
            # transfers per suite that can wedge.
            -o Acquire::Languages=none
          )

          # Sized against measurement, not against the healthy path. The
          # preamble before the fallback host first answers has been observed
          # at 38s, 38s and 72s, and update moves 11.4 MB (about 8.5 MB with
          # translations off). No completed update over the fallback exists in
          # the record, so this is deliberately loose: too tight a cap turns a
          # slow-but-recoverable run into a hard red, which is the outcome the
          # retry exists to avoid.
          attempts=2
          for attempt in $(seq 1 $attempts); do
            rc=0
            # `sudo timeout`, not `timeout sudo`: the kill has to reach
            # apt-get. Under `timeout sudo` the SIGKILL lands on sudo and
            # orphans a root apt-get still holding the lists lock. The
            # variable is set inside sudo because sudoers resets the
            # environment, so a step-level `env:` would never arrive.
            sudo DEBIAN_FRONTEND=noninteractive timeout --kill-after=15s 180s \
              apt-get "${opts[@]}" update || rc=$?

            # A failed update normally means installing would 404 on a stale
            # index. On the last attempt try regardless: the image ships
            # pre-seeded lists, and the packages this needs come from release
            # pockets that are never superseded, so it is the one remaining
            # path from red back to green.
            if [ "$rc" -eq 0 ] || [ "$attempt" -eq "$attempts" ]; then
              rc=0
              sudo DEBIAN_FRONTEND=noninteractive timeout --kill-after=15s 180s \
                apt-get "${opts[@]}" install -y \
                capnproto libfontconfig-dev libsqlite3-dev || rc=$?
              # Only an interrupted install can leave dpkg mid-transaction,
              # and this is the last unbounded call in the block, so it is
              # bounded too rather than left to the step ceiling.
              if [ "$rc" -ne 0 ]; then
                sudo DEBIAN_FRONTEND=noninteractive timeout --kill-after=10s 60s \
                  dpkg --configure -a || true
              fi
            fi

            if [ "$rc" -eq 0 ]; then
              exit 0
            fi

            echo "::warning::apt attempt $attempt failed with $rc (124 = timed out, 137 = had to be SIGKILLed)"
            # Guarded so the last iteration does not sleep for nothing, and
            # written as `if` because a trailing `&&` test would return 1 and
            # trip `set -e`.
            if [ "$attempt" -lt "$attempts" ]; then
              sleep 5
            fi
          done

          echo "::error::apt failed twice; the Ubuntu mirrors are not answering"
          exit 1

      # Homebrew has never stalled here, but it is the same kind of unbounded
      # network call and costs one line to bound.
      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: brew install capnp

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          # runner.arch is part of the key because runner.os is "Linux" for
          # both x86_64 and aarch64: without it the two Linux jobs would share
          # one cache and restore each other's target directory.
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-test-

      # No display is set up, and none is needed: the GUI tests drive Slint
      # through its testing backend with no event loop. The five ignored tests
      # want the developer's own GnuPG keyring or the network, so they stay
      # ignored here.
      - name: Test
        run: cargo test --workspace --locked

  windows-core:
    name: Windows (rpgp-core)
    runs-on: windows-latest
    timeout-minutes: 45
    # Blocking, unlike the informational job below, and the only place the
    # Windows ACL code is ever executed. Store writes real DACLs on secret keys
    # now, and the tests that read them back are all that stands between a typo
    # in an SDDL string and a key file every account on the machine can read.
    # Narrowed to rpgp-core deliberately: it needs no system SQLite
    # (sequoia-cert-store forces rusqlite/bundled here) and no nettle (the
    # workspace selects crypto-rust), so it does not depend on the much larger
    # bet that the GUI stack builds on Windows.
    steps:
      - uses: actions/checkout@v4

      # Chocolatey's CDN rate-limits, and this call is as unbounded as apt was.
      - name: Install capnproto
        timeout-minutes: 10
        run: choco install capnproto -y --no-progress

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-core-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-core-

      # The lint job runs on Linux and so never sees the cfg(windows) module.
      - name: Clippy
        run: cargo clippy -p rpgp-core --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test -p rpgp-core --locked

  windows-workspace:
    name: Windows workspace (informational)
    runs-on: windows-latest
    timeout-minutes: 45
    # Builds rather than checks, because `cargo check` never invokes the
    # linker: it cannot tell us whether Slint, wgpu on DX12, rfd's Win32 file
    # dialogs or arboard's clipboard actually resolve on this platform. The GUI
    # has never been linked here, and whether it links at all is the question.
    #
    # Still non-blocking, deliberately — the first run exists to find out, not
    # to redden master. Promote it to blocking once it is green; leaving it
    # informational forever is how the answer stays unknown.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # Chocolatey's CDN rate-limits, and this call is as unbounded as apt was.
      - name: Install capnproto
        timeout-minutes: 10
        run: choco install capnproto -y --no-progress

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-build-

      - name: Build
        run: cargo build --workspace --locked
