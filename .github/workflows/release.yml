# Builds the Flatpak bundle for each architecture and attaches both to the
# release for the tag that triggered the run.
#
# Bundles, not a repository. A .flatpak bundle is one architecture and does not
# update itself: whoever installs one stays on it until they reinstall by hand.
# Flathub is the channel that solves both, and these exist to bridge until it
# is there.
#
# Only official actions, for the reason the CI workflow gives: this is a
# project about handling secret keys, and a third-party action runs with the
# same access to the workflow as anything else in it. flatpak-builder comes
# from apt rather than from an action for the same reason.
#
# And each one pinned to a full commit, its version in the comment beside it,
# rather than to a tag its owner can move. This workflow makes the files people
# download, and the signature over SHA256SUMS covers whatever CI produced, so
# signing cannot catch an action that changed under its tag: whatever
# upload-artifact carries out of a build, download-artifact hands to the one
# job here holding a token that can write to a release. Moving to a newer
# version means resolving its tag to the commit it names (`gh api
# repos/actions/<name>/git/ref/tags/<tag>`, following an annotated tag through
# git/tags/) and changing the SHA and the comment together.
#
# What is deliberately NOT published here is a bare Linux binary. One built on
# a current distribution needs a glibc newer than Debian, Ubuntu LTS or Fedora
# ship, and links fontconfig, freetype, sqlite3, png, brotli, bz2 and expat
# from the host besides — so it runs almost nowhere except the machine that
# built it. The Flatpak carries its own runtime and is the portable artifact.
name: Release

on:
  push:
    tags: ["v*"]
  # So the workflow can be exercised without cutting a tag.
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or commit to build"
        required: true

# One run per tag at a time. A tag moved and pushed again while its first run
# is still building starts a second run under the same name, and both would
# otherwise reach `release` and --clobber the same draft, whichever finished
# last deciding file by file what it holds. The older run is cancelled
# instead: what it was building is no longer what the tag names. checksums.yml
# queues in the same group, so it never hashes a draft while an upload for
# that tag is under way.
#
# The group is named for whatever the ref is, so a second dispatch of the
# same commit or branch cancels the first as well, and the newer run is the
# one to wait for. A re-run of an older run joins the group like a new run
# and cancels a newer one in progress; if the tag has moved, the re-run's
# Upload then refuses, and the newer run has to be started again.
concurrency:
  group: release-${{ inputs.ref || github.ref_name }}
  cancel-in-progress: true

# Read by default; only the job that publishes gets write. The build jobs
# compile the build scripts of 800-odd crates, which run as ordinary code on
# the runner, so no checkout here leaves its credential on disk for them to
# find: nothing after a checkout needs git credentials. flatpak-builder clones
# the public URL, and gh is handed its token explicitly.
#
# For the same reason no job here restores a cache, unlike ci.yml. A manual
# run is dispatched on master whatever commit it builds, so it saves into
# master's cache scope, which every later run can restore, a tag build
# included. Cargo trusts what it finds there: it links a cached rlib whose
# fingerprint looks fresh, and unpacks a cached .crate without checking it
# against Cargo.lock, whose checksums it verifies only on download. A cache
# would let whatever one manual run compiled decide what a release links. It
# saved nothing either: no tag build ever restored one, because every release
# bumps Cargo.lock and CI's larger caches evict the old entry first. What
# ships is compiled here, from nothing.
permissions:
  contents: read

env:
  RUNTIME_VERSION: "25.08"
  # The tag being released. A tag push carries it in github.ref_name; a manual
  # run names it explicitly, which is the only way to build a tag cut before
  # this workflow existed — workflow_dispatch reads the workflow file from the
  # ref it is given, so such a tag can never dispatch itself.
  TAG: ${{ inputs.ref || github.ref_name }}

jobs:
  # The commit every job below builds, resolved once. The build jobs start on
  # separate runners, sometimes minutes apart, and if each checked out the ref
  # by name, a tag moved during the run could put Flatpaks from one commit and
  # an exe from another into the same release. Each checks out this SHA
  # instead, and the Upload step refuses if the tag has since moved off it.
  #
  # actions/checkout still does the resolving, so a branch, a tag and a full
  # SHA mean here what they meant when every job checked out inputs.ref. A tag
  # push gives it no ref at all: it then fetches the pushed tag and fails
  # unless that still names the commit the push event carried. Whether this is
  # a tag build is read from the checkout rather than from the name:
  # actions/checkout fetches the tag's ref when it was given a tag, and only
  # then.
  resolve:
    name: Resolve the commit to build
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Resolve
        id: resolve
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          tag=
          if tagged=$(git rev-parse -q --verify "refs/tags/${TAG}^{commit}"); then
            if [ "$tagged" != "$head" ]; then
              echo "::error::$TAG names $tagged, but the checkout is $head"
              exit 1
            fi
            tag=$TAG
          fi
          echo "sha=$head" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "building $head${tag:+ as $tag}"

  bundle:
    name: Flatpak (${{ matrix.arch }})
    needs: resolve
    timeout-minutes: 90
    strategy:
      # Off so that one architecture failing does not cancel the other: that
      # leg still finishes, and its bundle and log stay on the run. It does
      # not make a release with one architecture. `release` needs every leg
      # to have succeeded and attaches nothing otherwise, so after a failure
      # "Re-run failed jobs" rebuilds only the broken leg, from the commit
      # `resolve` already named, and then attaches the full set.
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: x86_64 }
          - { os: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      # Generated rather than committed: it is 420K, derived entirely from
      # Cargo.lock, and stale the moment a dependency moves. Generated first,
      # because it needs only python3 and the lockfile, and it refuses a
      # package the offline build could not fetch, which is better known now
      # than after the runtime install. ci.yml runs it on every push to master
      # and every pull request as well, but a manual run can name a commit CI
      # never saw.
      - name: Generate the offline cargo sources
        run: python3 packaging/cargo-sources.py > packaging/cargo-sources.json

      - name: Install flatpak-builder
        timeout-minutes: 20
        run: |
          set -euo pipefail
          # Same apt shape as ci.yml, and for the same reason: apt has no
          # wall-clock bound of its own, and a wedged Ubuntu mirror otherwise
          # hangs the step until the job ceiling.
          opts=(
            -o Acquire::Retries=2
            -o Acquire::http::Timeout=15
            -o Acquire::https::Timeout=15
            -o Acquire::Languages=none
          )
          attempts=2
          for attempt in $(seq 1 $attempts); do
            rc=0
            sudo DEBIAN_FRONTEND=noninteractive timeout --kill-after=15s 180s \
              apt-get "${opts[@]}" update || rc=$?
            if [ "$rc" -eq 0 ] || [ "$attempt" -eq "$attempts" ]; then
              rc=0
              sudo DEBIAN_FRONTEND=noninteractive timeout --kill-after=15s 300s \
                apt-get "${opts[@]}" install -y flatpak flatpak-builder || rc=$?
              if [ "$rc" -ne 0 ]; then
                sudo DEBIAN_FRONTEND=noninteractive timeout --kill-after=10s 60s \
                  dpkg --configure -a || true
              fi
            fi
            if [ "$rc" -eq 0 ]; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed with $rc"
            if [ "$attempt" -lt "$attempts" ]; then sleep 5; fi
          done
          echo "::error::apt failed twice; the Ubuntu mirrors are not answering"
          exit 1

      # The runtime is a large download and the bulk of this job's wall clock.
      #
      # Retried, because the failure seen here was Flathub advertising a commit
      # its CDN then 404s on — a repository mid-publish, not a missing ref. The
      # ref resolves; only the pull fails, and it succeeds once propagation
      # catches up. Nothing local can fix that, so the loop simply waits.
      - name: Install the freedesktop runtime and the Rust SDK extension
        timeout-minutes: 40
        run: |
          set -euo pipefail
          flatpak remote-add --if-not-exists --user \
            flathub https://dl.flathub.org/repo/flathub.flatpakrepo

          attempts=3
          for attempt in $(seq 1 $attempts); do
            rc=0
            flatpak install --user --noninteractive --arch=${{ matrix.arch }} flathub \
              org.freedesktop.Platform//$RUNTIME_VERSION \
              org.freedesktop.Sdk//$RUNTIME_VERSION \
              org.freedesktop.Sdk.Extension.rust-stable//$RUNTIME_VERSION || rc=$?
            if [ "$rc" -eq 0 ]; then
              exit 0
            fi
            echo "::warning::flatpak install attempt $attempt failed with $rc"
            if [ "$attempt" -lt "$attempts" ]; then
              # Long enough for a publish to finish propagating, short enough
              # to stay inside the step ceiling with three attempts.
              sleep 120
            fi
          done
          echo "::error::could not install the runtime after $attempts attempts."
          echo "::error::If this is a 404 while pulling, Flathub is advertising a commit"
          echo "::error::it cannot serve yet; the run needs retrying later, not fixing."
          exit 1

      # The manifest in the tree names the released tag. Building the exact
      # commit that was checked out keeps the artifact honest even when the two
      # disagree — a tag moved after the fact cannot change what shipped.
      #
      # `git rev-parse HEAD`, not GITHUB_SHA. On a manual run GITHUB_SHA is the
      # tip of the ref the workflow was *dispatched on* — master — while the
      # checkout above is the commit `resolve` found for inputs.ref. HEAD is
      # the commit being built by construction, on a tag push and a manual run
      # alike, and it has to be the one `resolve` named.
      #
      # `tag:` is rewritten with it, because flatpak-builder checks the two
      # against each other and refuses a source where they disagree ("Git
      # commit for branch (null) is <tag>, but expected <commit>"). On a tag
      # build it becomes the tag being built. On anything else — a dispatch
      # naming a commit or a branch, which is how this workflow is tested — the
      # line is removed, since no tag names that commit and leaving the
      # manifest's old one would contradict it. Rewriting only the pin was
      # right for a tag build and failed every other: a dispatch on an untagged
      # commit went on fetching v0.1.3 and was refused for it.
      #
      # Whether this is a tag build is `resolve`'s answer. This checkout is of
      # a bare commit and carries no tag to ask.
      - name: Point the manifest at this commit
        env:
          BUILD_SHA: ${{ needs.resolve.outputs.sha }}
          BUILD_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          if [ "$head" != "$BUILD_SHA" ]; then
            echo "::error::the checkout is $head, but resolve named $BUILD_SHA"
            exit 1
          fi
          python3 - "$head" "$BUILD_TAG" <<'PY'
          import pathlib, re, sys
          sha, tag = sys.argv[1], sys.argv[2]
          p = pathlib.Path("packaging/app.rpgp.rpgp.yml")
          s = p.read_text()
          # Counted, so that each is found exactly once: a manifest that grew a
          # second git source, or lost its pin or its tag, stops here instead of
          # building from whichever line happened to match first.
          s, n = re.subn(r"^        commit: [0-9a-f]{40}$",
                         f"        commit: {sha}", s, flags=re.M)
          assert n == 1, f"expected one commit: line in the manifest, found {n}"
          if tag:
              s, n = re.subn(r"^        tag: \S+$", f"        tag: {tag}", s, flags=re.M)
          else:
              s, n = re.subn(r"^        tag: \S+\n", "", s, flags=re.M)
          assert n == 1, f"expected one tag: line in the manifest, found {n}"
          p.write_text(s)
          print(f"building {sha} as {tag}" if tag else f"building {sha}, untagged")
          PY

      - name: Build
        timeout-minutes: 60
        run: |
          flatpak-builder --force-clean --disable-rofiles-fuse \
            --arch=${{ matrix.arch }} --repo=repo build \
            packaging/app.rpgp.rpgp.yml

      - name: Bundle
        run: |
          set -euo pipefail
          NAME="rpgp-${TAG}-${{ matrix.arch }}.flatpak"
          flatpak build-bundle --arch=${{ matrix.arch }} \
            repo "$NAME" app.rpgp.rpgp master
          sha256sum "$NAME"
          ls -lh "$NAME"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flatpak-${{ matrix.arch }}
          path: '*.flatpak'

  # Wired into `release` below, which needs this job and uploads its .exe:
  # Windows has shipped since v0.1.2 and the winget manifests point at the asset
  # produced here. It also keeps the release build honest — the workspace links
  # on Windows in CI, but a debug link is not a release link, and LTO and
  # codegen settings have their own ways of failing.
  #
  # Dispatching this workflow with a ref that does not start with `v` builds
  # every job here and skips the publish step, which is how to exercise this
  # without cutting a release.
  windows:
    name: Windows (x86_64)
    needs: resolve
    timeout-minutes: 60
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      # Chocolatey's CDN rate-limits, as ci.yml notes.
      - name: Install capnproto
        timeout-minutes: 10
        run: choco install capnproto -y --no-progress

      # Statically linked CRT, so the binary has no dependency outside Windows
      # itself. Without it the only non-system import is VCRUNTIME140.dll — the
      # Visual C++ Redistributable — which most machines happen to have and a
      # clean install does not, and whose absence shows up as a missing-DLL box
      # at launch rather than anything a user can act on.
      - name: Build
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --workspace --locked

      - name: Stage the binary
        shell: pwsh
        run: |
          $name = "rpgp-$env:TAG-x86_64.exe"
          Copy-Item target\release\rpgp.exe $name
          Get-Item $name | Select-Object Name, Length
          (Get-FileHash -Algorithm SHA256 $name).Hash

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x86_64
          path: '*.exe'

  # Not published from here, and unlike the Windows job that is not a matter
  # of confidence. What this builds has been run: the bundle launches on macOS,
  # falls back to the software renderer where there is no GPU and says so, and
  # creates its store with the right permissions. What it cannot do is reach a
  # user. Gatekeeper refuses an unsigned .app outright — tested on macOS 26,
  # the dialog reads "Apple could not verify rPGP is free of malware", offers
  # Move to Trash as the default button, and no longer offers Open Anyway at
  # all — so this artifact is an input to packaging/macos-sign.sh, which signs
  # and notarises it on the machine holding the Developer ID key. That key is
  # not here for the same reason no signing key is.
  #
  # Universal: macos-latest is Apple Silicon, and the Intel half is
  # cross-compiled beside it and joined with lipo. macOS is the only platform
  # here where one file serves both architectures — Flatpak and Windows each
  # need one per arch.
  macos:
    name: macOS (universal, signed by hand)
    needs: resolve
    timeout-minutes: 60
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      # librsvg is for rsvg-convert, which renders the icon when the bundle is
      # assembled. It is installed here, before the builds rather than after
      # them, so that a Homebrew failure costs a minute instead of a finished
      # build, and bounded because Homebrew is the same kind of unbounded
      # network call ci.yml bounds.
      - name: Install capnproto and librsvg
        timeout-minutes: 10
        run: brew install capnp librsvg

      - name: Add the Intel target
        run: rustup target add x86_64-apple-darwin

      # Both halves of the universal binary. -p rpgp-gui rather than
      # --workspace: this builds the shipped binary, and whether the whole
      # workspace compiles on macOS is already a blocking CI job.
      #
      # Both pinned to 11.0. Left alone, rustc defaults the Intel slice to
      # 10.12 and the Apple Silicon slice to 11.0, which puts a version in the
      # binary that LSMinimumSystemVersion then contradicts — and 10.12 is a
      # toolchain default rather than anything anyone has run the app on. Big
      # Sur reaches Intel Macs back to 2013, so the floor costs little, and it
      # can be lowered once someone has tested an older machine.
      - name: Build both architectures
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          set -euo pipefail
          cargo build --release --locked -p rpgp-gui --target aarch64-apple-darwin
          cargo build --release --locked -p rpgp-gui --target x86_64-apple-darwin

      - name: Assemble the app bundle
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          APP="rPGP.app"
          rm -rf "$APP" rpgp.iconset
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"

          # One binary serving Apple Silicon and Intel. macOS is the only
          # platform here where that is possible; Flatpak and Windows each
          # need a file per architecture.
          lipo -create -output "$APP/Contents/MacOS/rpgp" \
            target/aarch64-apple-darwin/release/rpgp \
            target/x86_64-apple-darwin/release/rpgp

          # From the same SVG the Linux packaging renders, so the icon cannot
          # drift between platforms. iconutil wants every size present.
          SVG=crates/rpgp-gui/desktop/app.rpgp.rpgp.svg
          mkdir -p rpgp.iconset
          for s in 16 32 128 256 512; do
            rsvg-convert -w "$s" -h "$s" "$SVG" -o "rpgp.iconset/icon_${s}x${s}.png"
            rsvg-convert -w "$((s * 2))" -h "$((s * 2))" "$SVG" \
              -o "rpgp.iconset/icon_${s}x${s}@2x.png"
          done
          iconutil -c icns rpgp.iconset -o "$APP/Contents/Resources/rpgp.icns"

          # None of the YAML indentation reaches the file: the block scalar
          # this script lives in strips it before bash runs, so the heredoc
          # starts at column 0, and its closing PLIST has to stay level with
          # the lines around it or the heredoc never ends.
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>rPGP</string>
            <key>CFBundleDisplayName</key><string>rPGP</string>
            <key>CFBundleIdentifier</key><string>app.rpgp.rpgp</string>
            <key>CFBundleExecutable</key><string>rpgp</string>
            <key>CFBundleIconFile</key><string>rpgp</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

          plutil -lint "$APP/Contents/Info.plist"
          echo "--- architectures ---"
          lipo -archs "$APP/Contents/MacOS/rpgp"
          echo "--- linked libraries ---"
          otool -L "$APP/Contents/MacOS/rpgp"
          echo "--- minimum macOS each slice demands (both must read 11.0) ---"
          for arch in arm64 x86_64; do
            printf '%s: ' "$arch"
            otool -l -arch "$arch" "$APP/Contents/MacOS/rpgp" \
              | awk '/LC_BUILD_VERSION/,/sdk/' | awk '/minos/{print $2; exit}'
          done

          # ditto rather than zip: it preserves the bundle's metadata, and it
          # is what notarisation expects to be handed later.
          NAME="rpgp-${TAG}-macos-universal.zip"
          ditto -c -k --keepParent "$APP" "$NAME"
          ls -lh "$NAME"
          shasum -a 256 "$NAME"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-universal
          path: 'rpgp-*-macos-universal.zip'

  release:
    name: Attach to the release
    needs: [resolve, bundle, windows]
    if: startsWith(inputs.ref || github.ref_name, 'v')
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Named patterns rather than everything the run produced, and `needs`
      # lists exactly the jobs those patterns come from, besides `resolve`,
      # which says what commit they were built from. Which jobs publish is
      # a decision, not a function of which finished first: collecting `*`
      # while waiting on a subset made publication a race. Adding a platform
      # means naming it twice, in `needs` and here, and that is the point.
      #
      # Windows ships unsigned, and that is a decision rather than a gap.
      # SmartScreen warns on first run — an unsigned exe with no download
      # history is what it exists to flag — but it warns and then lets the user
      # through, so the artifact is usable.
      #
      # Signing would not change that. Microsoft's own comparison marks every
      # non-Store option as "flagged as unrecognized until reputation
      # accumulates": an OV certificate, an EV certificate and an Azure Artifact
      # Signing subscription all leave the same warning in place, and EV's
      # instant-reputation bypass was removed in 2024. What a certificate buys
      # immediately is the publisher's name in the dialog instead of "Unknown
      # publisher" — real, but not the problem. Reputation accrues per file
      # hash, so a project at this size would wait months either way, and
      # Microsoft has reset established publisher reputation as recently as 2026
      # by migrating intermediate CAs.
      #
      # winget is the answer instead, and it is free: `winget install` carries
      # no Mark-of-the-Web and raises no SmartScreen prompt at all, so for users
      # who install that way the warning never happens. See packaging/winget/.
      # A Microsoft developer account is for Store submission and signs nothing
      # that is downloaded directly.
      #
      # macOS is deliberately absent, because there the same shortcut does not
      # exist: Gatekeeper refuses an unsigned .app outright, offering "Move to
      # Trash" and nothing else. That bundle detours through the machine
      # holding the Developer ID key and is uploaded to this draft by hand.
      # See packaging/macos-sign.sh.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: flatpak-*
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: windows-*
          merge-multiple: true

      # No SHA256SUMS here. It covers every artifact in the release, and one
      # of them — the signed macOS bundle — does not exist yet at this point,
      # so anything written now would be missing a file by the time the
      # release is complete. checksums.yml writes it once everything is
      # attached, which is also the only moment at which signing it by hand
      # means anything.
      #
      # Which is why the release is created as a draft. A draft is invisible
      # to anyone but this repository's maintainers, so there is no window in
      # which a half-assembled release — no checksums, no macOS build, no
      # signature over either — is something a stranger can download.
      # Publishing is the last step and a person does it.
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail

          mapfile -t files < <(
            find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -printf '%P\n' | sort
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no artifacts were collected, so there is nothing to publish"
            exit 1
          fi
          ls -lh "${files[@]}"

          # The tag has to name the commit these files were built from. Every
          # build job checked out the one commit `resolve` found, so they agree
          # with each other; this ties them to the tag. It matters most on a
          # re-run: "Re-run failed jobs" keeps the first attempt's builds and
          # the commit it resolved, and the tag may have moved since. Asked
          # for the bare SHA, which peels an annotated tag to its commit
          # without GitHub also computing that commit's diff.
          tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" \
            -H 'Accept: application/vnd.github.sha') || {
            echo "::error::could not find the commit the tag $TAG names"
            exit 1
          }
          if [ "$tagged" != "$BUILD_SHA" ]; then
            echo "::error::$TAG names $tagged, but these files were built from $BUILD_SHA."
            echo "::error::Run the workflow again for the tag as it now stands."
            exit 1
          fi

          # Whether there is a release for the tag, whether it is a draft and
          # what it carries, read so that any gh failure stops the step: taken
          # for "no release" it would create a second draft beside the first,
          # and taken for "no signature" it would --clobber assets under one.
          # From the REST listing, which shows drafts to a token that can push,
          # rather than from `gh release view`. That looks a release up two
          # ways at once and answers "release not found" when one lookup says
          # so and the other fails; for a draft the published-release lookup
          # always says so, so a passing error in the draft lookup reads
          # exactly like no release at all.
          ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.tag_name == env.TAG) | .id') || {
            echo "::error::could not list the releases of $GITHUB_REPOSITORY"
            exit 1
          }
          count=$(grep -c . <<<"$ids" || true)
          case $count in
          0)
            # A tag push creates no release on its own, so make one.
            # --verify-tag refuses to invent a tag that does not exist, which
            # would otherwise turn a typo into a published release.
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag --draft \
              --title "rPGP $TAG" \
              --generate-notes
            # Just made, so a draft with nothing attached.
            state=true
            ;;
          1)
            state=$(gh api "repos/$GITHUB_REPOSITORY/releases/$ids" \
              --jq '(.draft | tostring), .assets[].name') || {
              echo "::error::could not read the release for $TAG"
              exit 1
            }
            ;;
          *)
            echo "::error::$TAG has $count releases. Which one these files belong"
            echo "::error::to is not for this workflow to guess; delete the extra"
            echo "::error::drafts and run it again."
            exit 1
            ;;
          esac
          draft=$(head -n 1 <<<"$state")
          assets=$(tail -n +2 <<<"$state")

          # Only ever onto a draft, and never under a signature. A re-run, or a
          # dispatch naming a tag released long ago, would otherwise --clobber
          # files that people have downloaded and that SHA256SUMS.asc and the
          # winget manifest already vouch for — leaving a signature that fails
          # against the file beside it, which reads as tampering rather than as
          # a rebuild. The same refusal checksums.yml makes, for the same
          # reason: the operator decides, not the workflow. A release someone
          # made by hand and left public is refused too, since a half-attached
          # release is exactly what the draft exists to keep from strangers.
          if [ "$draft" != true ]; then
            echo "::error::$TAG is already published. Its assets are not replaced"
            echo "::error::after the fact; a changed build needs a new tag."
            exit 1
          fi
          if grep -qx 'SHA256SUMS.asc' <<<"$assets"; then
            echo "::error::$TAG already has SHA256SUMS.asc. Replacing assets would"
            echo "::error::invalidate it. Delete the signature first if the"
            echo "::error::artifacts genuinely need rebuilding:"
            echo "::error::  gh release delete-asset $TAG SHA256SUMS.asc"
            exit 1
          fi
          # An unsigned SHA256SUMS from an earlier run describes the builds
          # this upload is about to replace, and neither the .exe nor the
          # .flatpak is reproducible, so its lines for them are about to be
          # wrong. Left in place it is the file the earlier checksums.yml
          # summary tells the maintainer to download and sign, and a warning in
          # a green run's log would not stop that. Deleted, there is nothing
          # stale to sign: checksums.yml writes it again over what is attached.
          if grep -qx 'SHA256SUMS' <<<"$assets"; then
            gh release delete-asset "$TAG" SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" --yes
            echo "::warning::$TAG had an unsigned SHA256SUMS from an earlier run,"
            echo "::warning::which would not have matched these builds, so it was"
            echo "::warning::deleted. Run checksums.yml again once every asset is attached."
          fi

          gh release upload "$TAG" \
            "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" --clobber
