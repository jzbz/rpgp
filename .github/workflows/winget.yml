name: winget

# Open a pull request against microsoft/winget-pkgs when a release is published.
#
# On `release: published` rather than on a tag, and that is not incidental:
# winget's validation downloads the asset and checks its hash, and a draft
# release's assets are not publicly downloadable. release.yml deliberately
# creates a draft, so this can only run once the release is finished — after
# the macOS bundle is attached, after SHA256SUMS, after the signature over it.
# Publishing is the event that means "this is real", which is exactly when
# winget should hear about it.
#
# OPT-IN. It needs WINGET_PAT — a classic personal access token with
# `public_repo` scope — because the action opens a pull request against a fork
# of winget-pkgs under your account, which this repository's own token cannot
# do. That is a credential in CI, which this project otherwise avoids, so the
# job refuses to run without it rather than failing loudly on every release.
# If you would rather not hold that token here, delete this file and run Komac
# by hand instead; packaging/winget/README.md has the one-line command.
#
# The token cannot sign anything, cannot write to this repository, and cannot
# publish a release. The worst a leak buys is unwanted pull requests to a public
# manifest repository under your name — unpleasant, reversible, and nothing like
# a signing key.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to submit (e.g. v0.1.2)"
        required: true

permissions:
  contents: read

jobs:
  submit:
    name: Submit to winget-pkgs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check the token exists
        id: gate
        env:
          PAT: ${{ secrets.WINGET_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${PAT:-}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "## winget submission skipped"
              echo
              echo "No \`WINGET_PAT\` secret, so nothing was submitted. This is"
              echo "the default: the token is opt-in. Submit by hand instead —"
              echo "see \`packaging/winget/README.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      # Only the version, without the leading v: winget package versions are
      # bare, while the tag and every asset name carry the v.
      - name: Work out the version
        if: steps.gate.outputs.enabled == 'true'
        id: v
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v*) ;;
            *) echo "::error::expected a tag starting with v, got '$TAG'"; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # Refuse rather than submit a manifest pointing at an asset that is not
      # there: winget validation would fail on the download anyway, but failing
      # here says why, and does not leave a rejected PR on the record.
      - name: Check the asset is downloadable
        if: steps.gate.outputs.enabled == 'true'
        env:
          URL: https://github.com/${{ github.repository }}/releases/download/${{ steps.v.outputs.tag }}/rpgp-${{ steps.v.outputs.tag }}-x86_64.exe
        run: |
          set -euo pipefail
          echo "checking $URL"
          code=$(curl -sSL -o /dev/null -w '%{http_code}' "$URL")
          if [ "$code" != "200" ]; then
            echo "::error::$URL is not downloadable (HTTP $code)."
            echo "::error::A draft release's assets are not public — publish it first."
            exit 1
          fi

      - uses: vedantmgoyal9/winget-releaser@v2
        if: steps.gate.outputs.enabled == 'true'
        with:
          identifier: rPGP.rPGP
          version: ${{ steps.v.outputs.version }}
          installers-regex: '^rpgp-v[\d.]+-x86_64\.exe$'
          token: ${{ secrets.WINGET_PAT }}
