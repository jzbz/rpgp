[workspace]
resolver = "3"
members = ["crates/rpgp-core", "crates/rpgp-gui"]

[workspace.package]
version = "0.1.4"
edition = "2024"
# What cargo will actually build, not what the edition alone asks for. 1.85 was
# the edition's own floor and stopped being true twice over: this workspace uses
# let-chains, stable in 1.88, and slint 1.18 declares 1.92 throughout its tree,
# which cargo enforces whatever the source needs. rpgp-core on its own still
# checks on 1.89 — the toolkit is the whole of the difference.
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/jzbz/rpgp"

[workspace.dependencies]
# Clears rpgp's own copies of a passphrase. Sequoia seals its Password type
# already; this covers the String that exists before it becomes one.
zeroize = "1"
rpgp-core = { path = "crates/rpgp-core" }

# Pure-Rust crypto backend. `crypto-rust` is not the default (nettle is), and it
# refuses to build without the two `allow-*` opt-ins because RustCrypto is not
# constant-time everywhere. `compression-bzip2` is deliberately absent: it links
# the C bzip2 library, and dropping it costs only BZip2-compressed messages.
sequoia-openpgp = { version = "2.4", default-features = false, features = [
    "crypto-rust",
    "allow-experimental-crypto",
    "allow-variable-time-crypto",
    "compression-deflate",
] }
# default-features = false drops `keyserver`, which pulls in sequoia-net and
# tokio. Leave it off: lookup landed hand-rolled in keyserver.rs over plain
# reqwest precisely because sequoia-net hardcodes hyper-tls and a
# dnssec-openssl resolver, and OpenSSL is what this build avoids everywhere
# else. Re-enabling the feature would pull it back in.
sequoia-cert-store = { version = "0.7", default-features = false }
# Web-of-trust authentication. Depends on the same sequoia-openpgp 2.x and
# cert-store 0.7 we already use, and forces no crypto backend of its own.
#
# Held at 0.15.2. 0.15.3 no longer judges the certified key's own validity, so
# a certification of a key that had expired or been revoked counts, and two of
# certify.rs's tests fail under it; it also deprecates the
# CertificationError::Target* variants that certify::verdict matches. Lift the
# pin together with reworking certify.rs for that, and with rpgp-core's wot.rs
# module doc and the README's Authentication paragraph, which both say an
# expired or revoked key reads as unauthenticated.
sequoia-wot = "=0.15.2"
# Talks to the user's running gpg-agent. This is how rpgp reaches smartcard
# keys: scdaemon owns the reader exclusively, so going through the agent is the
# only way in on a machine that has GnuPG set up — and PIN entry stays with the
# user's own pinentry, never with us.
sequoia-gpg-agent = "0.6"
# For Keygrip, which is how the agent indexes keys. Already in the tree via
# sequoia-gpg-agent; naming it here only makes the type reachable. Its build
# script needs the `capnp` compiler installed.
sequoia-ipc = { version = "0.36", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread"] }
# Keyserver and WKD lookup. reqwest with rustls only: sequoia-net would do this
# for us but hardcodes hyper-tls and a dnssec-openssl resolver with no feature
# to opt out, which would put OpenSSL into a build that has kept it out
# everywhere else.
#
# `rustls-no-provider` and not `rustls`, which since 0.13 means aws-lc-rs: a C
# library, kept out as OpenSSL is. `rustls-no-provider` in turn leaves
# reqwest to encrypt with whatever provider the process installed and to verify
# through rustls-platform-verifier, which on macOS and Windows hands each
# certificate to the operating system to judge. This build wants neither, so
# every client is handed a TLS configuration of rpgp's own; `tls` in
# keyserver.rs says why.
#
# `charset`, one of reqwest's defaults, is left off. It only teaches
# `Response::text` and `text_with_charset` to decode by the charset a reply
# declares, and nothing here calls either: every body is read in bounded
# chunks instead, so it would only compile encoding_rs and mime.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "json"] }
# That configuration's parts. rustls has to stay on the major reqwest uses:
# reqwest recognises a configuration it is handed by downcasting to its own
# `rustls::ClientConfig`, so one built from a second copy would make every
# client fail to build. ring rather than aws-lc-rs, as reqwest 0.12's
# `rustls-tls` chose, and Mozilla's root store as webpki-roots compiles it in,
# which is what that feature trusted.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
# The operating system's trust anchors, added beside Mozilla's so that a
# keyserver certified by an organisation's own CA can be reached. It only reads
# certificates, from PEM files on Linux and from the system stores on macOS and
# Windows, and builds no C: checking a certificate against them stays in
# rustls.
rustls-native-certs = "0.8"
serde_json = "1"
# Only for the WKD hash in keyserver.rs, which needs nothing beyond `Digest`.
# Default features are off because `oid` would pull in const-oid 0.10 beside
# the 0.9 the crypto backend already compiles, for an identifier nothing here
# asks for.
sha1 = { version = "0.11", default-features = false }
z-base-32 = "0.1"

anyhow = "1"
thiserror = "2"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Slint's winit backend: 1.18.1 as crates.io serves it, plus the one change
# from Slint's master that puts copy and paste back into the text fields of
# the Flatpak on a Wayland session, slint-ui/slint#14248 (merged 2026-10-20 as
# cb91c1927c, due in Slint 1.19; no 1.18.x carries it). Slint 1.18 gave its
# text fields arboard and nothing behind it, and arboard needs a data-control
# protocol or X11. The Flatpak on a Wayland session has neither: GNOME offers
# no data-control, KDE Plasma and sway hide it from a sandboxed client, and
# --socket=fallback-x11 grants no X11 there. Its text fields then copied and
# pasted nothing, with no error. The change has Slint copy over the core
# wl_data_device protocol, which every compositor offers every client, on the
# event loop's own connection, as Slint 1.17 did through copypasta.
#
# vendor/i-slint-backend-winit is crates.io's archive of 1.18.1, unpacked,
# with vendor/i-slint-backend-winit.patch applied and nothing else. The
# archive is
#   https://static.crates.io/crates/i-slint-backend-winit/i-slint-backend-winit-1.18.1.crate
# with sha256
#   dae4fcf1b19e9cb109984d2af87d2b9485388c619265bff71dd523133888bee2
# as crates.io's index records it. Unpack it, run `patch -p1` in it with that
# file, and `diff -r` against vendor/i-slint-backend-winit finds nothing. The
# lines the patch adds and removes are upstream's own, in clipboard.rs and in
# the manifest the archive keeps as Cargo.toml.orig. Only the context
# differs, as upstream's create_clipboard had moved from cfg_if to cfg_select
# by then, and the same manifest change is written out again in Cargo.toml,
# the normalised manifest cargo reads. The dependency graph is not upstream's
# to the letter:
# upstream's lockfile took smithay-clipboard 0.7.2, which keeps to winit's
# smithay-client-toolkit 0.19, where Cargo.lock here has 0.7.3, on 0.20, the
# smithay-clipboard rPGP 0.1.4 shipped with. The crate is not a workspace
# member, so fmt and clippy leave it alone. Its licence is Slint's, under
# which rPGP uses Slint: its LICENSES directory and SPDX headers stay with it,
# and README.md's Licence section says so.
#
# The patched clipboard keeps a thread on the event loop's Wayland connection,
# and upstream's SAFETY comment rests on Slint keeping that connection for as
# long as the clipboard. rPGP's restart on the software renderer, when the
# first window cannot be made on the GPU, keeps to that: the first-window
# watch in src/lib.rs ends the loop normally, and Slint puts the winit event
# loop back before it returns the error it kept (EventLoopState::run in the
# crate's event_loop.rs), so the connection lasts until exec replaces the
# process. Traced under gdb on a nested KWin, reached through a proxy that
# hid linux-dmabuf so that the GPU renderer failed at the first window:
# nothing disconnected the event loop's display before the exec. 24 such
# restarts, on KWin, KWin with the Flatpak's sandbox and mutter, each went on
# to paste into a text field.
#
# cargo applies a [patch] only while the graph asks for the version it names,
# and otherwise only warns, so a newer slint would quietly drop it. That is
# why crates/rpgp-gui/Cargo.toml pins slint, slint-build and
# i-slint-backend-testing to =1.18.1, and why src/clipboard.rs has a test that
# fails when Cargo.lock shows the patch going unused.
#
# Drop it with Slint 1.19:
# - delete vendor/ and this table with this comment;
# - delete that test (`the_winit_backend_is_the_patched_one_until_slint_1_19`,
#   which fails on 1.19 to say so) with the LockTable and lock_tables helpers
#   only it uses, and its mention in the comment over src/clipboard.rs's
#   tests module;
# - turn the three =1.18.1 pins in crates/rpgp-gui/Cargo.toml (slint,
#   i-slint-backend-testing and slint-build) back into plain 1.19
#   requirements, and take out the comments there that explain the pins;
# - reword the sentence in src/clipboard.rs's module doc that says Slint's
#   clipboard is the patched winit backend until 1.19;
# - remove the vendor/ paragraph from README.md's Licence section, and the
#   vendor/ mention in packaging/cargo-sources.py.
# smithay-clipboard stays in the graph, through Slint's own backend.
# src/clipboard.rs's route to Slint's clipboard for the Copy buttons stays
# too: it is what 1.19 needs.
[patch.crates-io]
i-slint-backend-winit = { path = "vendor/i-slint-backend-winit" }

[profile.release]
opt-level = 3
lto = "thin"
strip = "debuginfo"

# Sequoia protects every secret key it encrypts, v4 and v6 alike, with its
# default S2K: iterated SHA-256 over 62 MiB. A protected key costs one pass for
# each of its four key packets when it is generated and one more each time it
# is unlocked, and with sha2 left at the dev profile's opt-level 0 a pass took
# about a second, which was most of what the passphrase tests spent. Optimised,
# it takes a few dozen milliseconds. Nothing else in the hashing path was worth
# the same: digest and block-buffer at opt-level 3 as well measured no faster.
# This reaches `cargo test` and `cargo run` alike, since the test profile
# inherits dev's, changes nothing a release build does, and leaves debug
# assertions and overflow checks on everywhere, rpgp's own crates included.
[profile.dev.package.sha2]
opt-level = 3

# The same for SHA-1, which is what GnuPG protects an exported secret key with:
# iterated over 62 MiB, as much as OpenPGP can encode. Sequoia's SHA-1 is
# sha1collisiondetection, and at opt-level 0 a pass took about 1.4 seconds.
# The tests of GnuPG's exports pay it twice for every unlock, since a secret
# sequoia refuses is decrypted a second time (see `secret::unlock`), and twice
# for every wrong passphrase: over 40 seconds for tests/gnupg_protected.rs,
# where they take about 3 optimised. Like sha2's, this changes nothing a
# release build does.
[profile.dev.package.sha1collisiondetection]
opt-level = 3
